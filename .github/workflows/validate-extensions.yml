name: Validate Blog Themes, Plugins & Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifests
        run: python setup.py --validate
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Auto-sync README and catalog on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'cmduyeen/pro-blog-starter-kit'
        run: |
          python setup.py --sync-readme
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog already up to date."
          else
            git commit -m "docs: auto-sync blog themes and plugins catalog"
            git push
          fi
